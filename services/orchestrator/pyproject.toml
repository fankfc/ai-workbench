[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench-orchestrator"
version = "0.1.0"
description = "Local orchestration service package scaffold"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "markdown-it-py==4.0.0",
    "python-docx==1.2.0",
    "reportlab==4.4.9",
    "PyMuPDF==1.26.5",
    "fonttools==4.60.1",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "rfc3339-validator==0.1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = ["storage/schema/*.sql", "profiles/*.yaml", "prompts/**/*.md", "prompts/**/*.json", "translation/prompts/*.txt"]

[tool.uv]
required-version = "==0.13.0"
