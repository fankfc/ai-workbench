<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}svg{display:block}</style></head>
<body>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei UI',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1A36"/><stop offset="1" stop-color="#0F2E5C"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB6F5"/><stop offset="1" stop-color="#7ED9A9"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg2)"/>
  <rect width="1280" height="640" fill="url(#grid2)"/>

  <text x="640" y="92" text-anchor="middle" font-size="34" font-weight="700" fill="#F4F7FD">一句话，变成一条透明的智能体流水线</text>
  <text x="640" y="126" text-anchor="middle" font-size="15.5" fill="#7E93BC">全程可见 · 任务书带验收标准 · 执行过程实时直播 · 结果自动注回</text>

  <!-- 流水线节点 -->
  <line x1="150" y1="330" x2="1130" y2="330" stroke="url(#flow)" stroke-width="3" stroke-dasharray="3 7" opacity=".8" stroke-linecap="round"/>

  <g text-anchor="middle">
    <!-- 你 -->
    <g>
      <circle cx="150" cy="330" r="42" fill="#152E5C" stroke="#8FB6F5" stroke-width="2.5"/>
      <text x="150" y="337" font-size="20" font-weight="700" fill="#BAD2F7">你</text>
      <text x="150" y="404" font-size="16.5" font-weight="600" fill="#E8EFFB">一句需求</text>
      <text x="150" y="428" font-size="12.5" fill="#7E93BC">Enter 发送</text>
    </g>
    <path d="M204 322l16 8-16 8z" fill="#7C9BE0"/>
    <!-- A -->
    <g>
      <circle cx="380" cy="330" r="46" fill="#152E5C" stroke="#6FA0F2" stroke-width="3"/>
      <text x="380" y="327" font-size="22" font-weight="800" fill="#8FB6F5">A</text>
      <text x="380" y="350" font-size="12" fill="#A9C1E8">推理</text>
      <text x="380" y="404" font-size="16.5" font-weight="600" fill="#E8EFFB">整理任务书</text>
      <text x="380" y="428" font-size="12.5" fill="#7E93BC">验收标准 · 默认值 · 禁改范围</text>
    </g>
    <path d="M438 322l16 8-16 8z" fill="#7C9BE0"/>
    <!-- 队列 -->
    <g>
      <rect x="524" y="286" width="46" height="60" rx="10" fill="#122E42" stroke="#4C7BC4" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="533" y="300" width="28" height="6" rx="3" fill="#35599C"/>
      <rect x="533" y="312" width="28" height="6" rx="3" fill="#35599C"/>
      <rect x="533" y="324" width="20" height="6" rx="3" fill="#7ED9A9"/>
      <text x="547" y="404" font-size="16.5" font-weight="600" fill="#E8EFFB">文件队列</text>
      <text x="547" y="428" font-size="12.5" fill="#7E93BC">纯 Markdown 协议</text>
    </g>
    <path d="M634 322l16 8-16 8z" fill="#7C9BE0"/>
    <!-- B -->
    <g>
      <circle cx="760" cy="330" r="46" fill="#122E42" stroke="#7ED9A9" stroke-width="3"/>
      <text x="760" y="327" font-size="22" font-weight="800" fill="#7ED9A9">B</text>
      <text x="760" y="350" font-size="12" fill="#9FD9BE">执行</text>
      <text x="760" y="404" font-size="16.5" font-weight="600" fill="#E8EFFB">干活并直播</text>
      <text x="760" y="428" font-size="12.5" fill="#7E93BC">每一步实时滚动可见</text>
    </g>
    <path d="M818 322l16 8-16 8z" fill="#7C9BE0"/>
    <!-- 结果 -->
    <g>
      <circle cx="906" cy="314" r="32" fill="#153A33" stroke="#7ED9A9" stroke-width="2.5"/>
      <path d="M891 315l10 10 20-21" fill="none" stroke="#7ED9A9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="906" y="404" font-size="16.5" font-weight="600" fill="#E8EFFB">结果回对话</text>
      <text x="906" y="428" font-size="12.5" fill="#7E93BC">Markdown 渲染 · 一键返修</text>
    </g>
    <path d="M952 322l16 8-16 8z" fill="#7C9BE0"/>
    <!-- 注回 -->
    <g>
      <circle cx="1090" cy="330" r="42" fill="#152E5C" stroke="#BAD2F7" stroke-width="2.5"/>
      <text x="1090" y="336" font-size="17" font-weight="700" fill="#BAD2F7">会话</text>
      <text x="1090" y="404" font-size="16.5" font-weight="600" fill="#E8EFFB">自动注回</text>
      <text x="1090" y="428" font-size="12.5" fill="#7E93BC">智能体接着结果继续干</text>
    </g>
  </g>

  <!-- 直播终端卡片 -->
  <g font-family="Consolas,monospace">
    <rect x="460" y="164" width="360" height="76" rx="12" fill="#0A1428" stroke="#24406F"/>
    <circle cx="478" cy="182" r="4" fill="#FF7B72"/><circle cx="492" cy="182" r="4" fill="#F2CC60"/><circle cx="506" cy="182" r="4" fill="#7ED9A9"/>
    <text x="478" y="208" font-size="12.5" fill="#8FA8CF">▶ 开始一步</text>
    <text x="348" y="226" font-size="12.5" fill="#7FBFA0">🔧 write mt-a.txt ·◾ 核对验收▌</text>
  </g>
  <text x="640" y="520" text-anchor="middle" font-size="14" fill="#6279A8">A / B 均可热切换：Kilo · Claude Code · Codex · ZCode 会话</text>
  <text x="640" y="576" text-anchor="middle" font-size="15" fill="#6279A8" font-family="Consolas,monospace">智能体协作桥 · github.com/fankfc/ai-workbench</text>
</svg>
</body></html>
