<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能体协作桥</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23245BC1'/%3E%3Ccircle cx='11' cy='16' r='4.5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='21.5' cy='16' r='4.5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M15 16h2.5' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<style>
  :root {
    --canvas:#FCFCFB; --surface:#F5F5F3; --bubble:#FFFFFF; --sidebar:#F8F8F6;
    --text:#1A1A19; --muted:#6B6B67; --faint:#9C9C97; --border:#E6E6E2; --border-strong:#D6D6D0;
    --accent:#245BC1; --accent-soft:#EDF2FB; --danger:#B42318; --success:#236445;
    --shadow-sm:0 1px 2px rgba(20,20,18,.05);
    --shadow-md:0 4px 16px rgba(20,20,18,.08);
    --radius:12px;
    --p0-bg:#EFF4FB; --p0-bd:#B4C9E6; --p0-tx:#4A6D9E;
    --p1-bg:#EBF5EF; --p1-bd:#B0D3BF; --p1-tx:#4E7D62;
    --p2-bg:#FBF5E9; --p2-bd:#E2CE9F; --p2-tx:#8F7638;
    --p3-bg:#F3F0FA; --p3-bd:#C6B8E2; --p3-tx:#6F5D9C;
    --p4-bg:#FAF0F3; --p4-bd:#E5BAC9; --p4-tx:#A05E74;
    --p5-bg:#EAF4F6; --p5-bd:#ADD2DA; --p5-tx:#4E7B85;
    --p6-bg:#F2F2EC; --p6-bd:#D2CCB6; --p6-tx:#7C7455;
    --p7-bg:#F0F1F4; --p7-bd:#BEC3D2; --p7-tx:#5D6478;
    --chip-bg:#FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:#141414; --surface:#1E1E1D; --bubble:#1B1B1A; --sidebar:#171716;
      --text:#F1F1EE; --muted:#A8A8A2; --faint:#77776F; --border:#2C2C29; --border-strong:#3A3A36;
      --accent:#8FB6F5; --accent-soft:#1D2634; --danger:#FFA69E; --success:#91DBB7;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow-md:0 4px 16px rgba(0,0,0,.4);
      --p0-bg:#1B2531; --p0-bd:#3A5375; --p0-tx:#8FB4E3;
      --p1-bg:#1A2A21; --p1-bd:#3C6349; --p1-tx:#8FC9A6;
      --p2-bg:#2B2618; --p2-bd:#6E5C2E; --p2-tx:#D3BC82;
      --p3-bg:#241F31; --p3-bd:#4C3F6E; --p3-tx:#B4A3DE;
      --p4-bg:#2B1E24; --p4-bd:#6E4152; --p4-tx:#D9A2B4;
      --p5-bg:#1A282B; --p5-bd:#3D6169; --p5-tx:#9CC6CF;
      --p6-bg:#26261E; --p6-bd:#5C563E; --p6-tx:#C4BC96;
      --p7-bg:#1F2126; --p7-bd:#454B5C; --p7-tx:#A6ADC2;
      --chip-bg:#232322;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--canvas); color:var(--text); display:flex; flex-direction:column;
    font:14.5px/1.65 "Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
    font-feature-settings:"tnum"; -webkit-font-smoothing:antialiased; }

  /* ---------- 顶栏 ---------- */
  header { display:flex; align-items:center; gap:10px; padding:10px 18px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); background:var(--canvas); z-index:2; }
  .brand { display:flex; align-items:center; gap:9px; margin-right:6px; }
  .brand .logo { width:22px; height:22px; border-radius:6px; background:var(--accent);
    display:grid; place-items:center; color:#fff; }
  @media (prefers-color-scheme: dark) { .brand .logo { color:#141414; } }
  .brand h1 { font-size:14.5px; margin:0; font-weight:650; letter-spacing:.2px; }
  .brand .sub { font-size:11px; color:var(--faint); letter-spacing:.4px; }
  .cluster { display:flex; gap:6px; align-items:center; margin-left:auto; flex-wrap:wrap; }
  .pill { font-size:11.5px; color:var(--muted); background:var(--surface);
    border:1px solid var(--border); border-radius:999px; padding:2px 9px; display:inline-flex; align-items:center; gap:5px; }
  .pill b { color:var(--text); font-weight:600; }
  .pill.bad b { color:var(--danger); }
  .pill .led { width:6px; height:6px; border-radius:50%; background:var(--faint); }
  .pill.on .led { background:var(--success); box-shadow:0 0 0 3px color-mix(in srgb, var(--success) 20%, transparent); }

  #layout { display:flex; width:100%; height:100%; min-height:0; }

  /* ---------- 侧栏 ---------- */
  #sidebar { width:242px; flex:none; border-right:1px solid var(--border); background:var(--sidebar);
    display:flex; flex-direction:column; overflow-y:auto; padding:12px 0 10px; }
  .side-head { display:flex; align-items:center; justify-content:space-between;
    padding:2px 14px 10px; font-size:11px; font-weight:650; color:var(--faint);
    text-transform:uppercase; letter-spacing:.8px; }
  .side-head button { background:none; border:1px solid var(--border); color:var(--muted);
    border-radius:6px; font-size:11px; padding:2px 8px; cursor:pointer; text-transform:none; letter-spacing:0;
    transition:all .12s; }
  .side-head button:hover { color:var(--accent); border-color:var(--accent); }
  .proj { margin:1px 0; }
  .proj-name { padding:5px 12px; font-size:13px; font-weight:600; display:flex; align-items:center;
    justify-content:space-between; gap:6px; color:var(--text); }
  .proj-name .pname { display:flex; align-items:center; gap:7px; min-width:0; }
  .proj-name .pname svg { flex:none; opacity:.55; }
  .proj-name .pname span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .proj-name .add { background:none; border:none; color:var(--faint); cursor:pointer; font-size:15px;
    border-radius:6px; width:22px; height:22px; flex:none; line-height:1; transition:all .12s; }
  .proj-name .add:hover { color:var(--accent); background:var(--canvas); }
  .thread-item { display:flex; align-items:center; gap:8px; padding:4.5px 12px 4.5px 30px; font-size:12.8px;
    color:var(--muted); cursor:pointer; border-radius:7px; margin:0 6px; transition:background .12s; }
  .thread-item svg { flex:none; opacity:.6; }
  .thread-item:hover { background:var(--canvas); color:var(--text); }
  .thread-item.active { background:var(--canvas); color:var(--text); font-weight:600; box-shadow:var(--shadow-sm); }
  .thread-item .cnt { font-size:10.5px; color:var(--faint); background:var(--surface);
    border-radius:999px; padding:0 6px; margin-left:auto; }
  .side-foot { margin-top:auto; padding:12px 14px 4px; font-size:11px; color:var(--faint); line-height:1.6;
    border-top:1px solid var(--border); }

  #main { flex:1; display:flex; flex-direction:column; height:100%; min-width:0; }

  /* ---------- 对话区 ---------- */
  #chat { flex:1; overflow-y:auto; padding:20px 22px 10px; scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce) { #chat { scroll-behavior:auto; } }
  .thread { max-width:820px; margin:0 auto; }
  .daysep { text-align:center; color:var(--faint); font-size:11.5px; margin:20px 0 8px; }
  .daysep span { background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:1px 12px; }
  .turn { margin:16px 0; display:flex; flex-direction:column; gap:6px; }
  .msg-row { display:flex; gap:9px; align-items:flex-end; }
  .msg-row.bot { flex-direction:row; }
  .msg-row.user { flex-direction:row-reverse; }
  .avatar { width:26px; height:26px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-size:10.5px; font-weight:700; background:var(--pbg, var(--surface)); color:var(--ptx, var(--muted));
    border:1.5px solid var(--pb, var(--border)); margin-bottom:2px; user-select:none; }
  .msg { max-width:78%; border-radius:14px; padding:9px 13px; border:1px solid var(--pb, var(--border));
    box-shadow:var(--shadow-sm); }
  .msg.user { background:var(--pbg, var(--surface)); border-right-width:3px; border-top-right-radius:5px; }
  .msg.bot { background:var(--bubble); border-left-width:3px; border-top-left-radius:5px; }
  .msg .meta { font-size:11px; color:var(--faint); margin-bottom:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .msg .body { word-break:break-word; font-size:14px; }
  .msg.user .body { white-space:pre-wrap; }
  .msg .file { font-family:"Cascadia Code",Consolas,monospace; font-size:10.5px; color:var(--faint); }
  .md-p { margin:2px 0; }
  .md-h { font-weight:650; margin:7px 0 2px; }
  .md-ul { margin:2px 0; padding-left:19px; }
  .msg .body code { font-family:"Cascadia Code",Consolas,monospace; font-size:.9em;
    background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:0 4px; }
  .msg .body pre { background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; overflow-x:auto; }
  .msg .body pre code { background:none; border:none; padding:0; }
  .chip { font-size:11px; border-radius:999px; padding:0 8px; border:1px solid var(--border); white-space:nowrap;
    background:var(--chip-bg); font-weight:550; }
  .chip.排队中 { color:#8a6100; background:#fdf6e3; border-color:#e8d9a8; }
  .chip.执行中 { color:var(--accent); background:var(--accent-soft); border-color:var(--accent); }
  .chip.done { color:var(--success); background:color-mix(in srgb, var(--success) 10%, var(--chip-bg)); border-color:color-mix(in srgb, var(--success) 45%, var(--border)); }
  .chip.failed, .chip.needs-user, .chip.unknown { color:var(--danger); background:color-mix(in srgb, var(--danger) 9%, var(--chip-bg)); border-color:color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .chip.stale { color:var(--danger); border-color:var(--danger); }
  .chip.推理中 { color:var(--accent); border-color:var(--accent); }
  .chip.已入队 { color:var(--success); border-color:var(--success); }
  .chip.失败 { color:var(--danger); border-color:var(--danger); }
  .waiting { color:var(--muted); }
  .dots::after { content:"…"; animation:blink 1.4s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation:none; } }
  .progress { margin-top:6px; border-left:2px solid var(--pb, var(--border)); padding-left:10px;
    font-family:"Cascadia Code",Consolas,monospace; font-size:11.5px; color:var(--muted); }
  .progress div { padding:1px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .progress div:last-child { color:var(--ptx, var(--text)); }
  .progress div:last-child::after { content:"▌"; animation:blink 1s infinite; margin-left:2px; }
  @media (prefers-reduced-motion: no-preference) { .turn { animation:turn-in .18s ease-out; } }
  @keyframes turn-in { from { opacity:0; transform:translateY(4px); } to { opacity:1; } }
  .inject { color:var(--muted); font-size:12.5px; margin-top:8px; border-top:1px dashed var(--border); padding-top:6px; }
  .actions { display:flex; gap:6px; margin-top:8px; opacity:0; transition:opacity .15s; }
  .msg:hover .actions { opacity:1; }
  .actions button { background:var(--surface); color:var(--muted); border:1px solid var(--border);
    font-size:11.5px; padding:2px 11px; min-height:24px; border-radius:999px; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px; transition:all .12s; }
  .actions button:hover { color:var(--accent); border-color:var(--accent); }
  @media (prefers-reduced-motion: reduce) { .actions { opacity:1; } }

  /* ---------- 空状态 ---------- */
  .empty-hero { text-align:center; padding:56px 20px 30px; color:var(--muted); }
  .empty-hero svg { opacity:.9; margin-bottom:14px; }
  .empty-hero h2 { font-size:16px; color:var(--text); font-weight:650; margin:0 0 6px; }
  .empty-hero p { font-size:13px; margin:0; }
  .empty-steps { display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .empty-steps .step { background:var(--bubble); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; font-size:12px; color:var(--muted); max-width:180px; text-align:left; box-shadow:var(--shadow-sm); }
  .empty-steps .step b { display:block; color:var(--text); font-size:12.5px; margin-bottom:2px; }

  /* ---------- 输入区 ---------- */
  .composer-wrap { border-top:1px solid var(--border); background:var(--canvas); padding:10px 20px 12px; position:relative; }
  .roles { max-width:820px; margin:0 auto 8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    font-size:12px; color:var(--muted); }
  .roles label { display:inline-flex; align-items:center; gap:6px; background:var(--surface);
    border:1px solid var(--border); border-radius:999px; padding:2.5px 6px 2.5px 12px; }
  .roles label b { font-weight:600; color:var(--text); font-size:11.5px; }
  .roles select { font:inherit; font-size:12px; padding:1px 4px; border:none; background:transparent;
    color:var(--accent); outline:none; cursor:pointer; }
  .roles select option { color:var(--text); background:var(--bubble); }
  .role-note { font-size:11px; color:var(--faint); flex:1; min-width:180px; text-align:right; }
  .composer { max-width:820px; margin:0 auto; display:flex; gap:9px; align-items:flex-end; }
  .composer textarea { flex:1; min-height:46px; max-height:180px; resize:none; border:1px solid var(--border-strong);
    border-radius:14px; padding:11px 14px; font:inherit; background:var(--bubble); color:var(--text);
    box-shadow:var(--shadow-sm); transition:border-color .15s, box-shadow .15s; }
  .composer textarea:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  button.primary { border:none; border-radius:12px; background:var(--accent); color:#fff; font:inherit;
    padding:0 18px; cursor:pointer; min-height:46px; display:inline-flex; align-items:center; gap:7px;
    font-weight:600; transition:filter .12s, transform .06s; }
  @media (prefers-color-scheme: dark) { button.primary { color:#141414; } }
  button.primary:hover { filter:brightness(1.06); }
  button.primary:active { transform:scale(.98); }
  button.primary:disabled { opacity:.5; cursor:default; }
  .hint { max-width:820px; margin:5px auto 0; color:var(--faint); font-size:11px; display:flex; justify-content:space-between; }
  details.logbox { max-width:820px; margin:2px auto 0; color:var(--faint); font-size:11.5px; }
  details.logbox summary { cursor:pointer; user-select:none; }
  .log { font-family:"Cascadia Code",Consolas,monospace; font-size:11px; color:var(--muted); max-height:160px; overflow-y:auto; }
  .log div { padding:1.5px 0; border-bottom:1px dashed var(--border); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .log time { color:var(--faint); margin-right:8px; }
  #jump { position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    font-size:12px; padding:4px 15px; cursor:pointer; box-shadow:var(--shadow-md); display:none;
    align-items:center; gap:6px; }
  @media (prefers-color-scheme: dark) { #jump { color:#141414; } }
  #jump.show { display:inline-flex; }
  #jump .badge { background:var(--danger); color:#fff; border-radius:999px; padding:0 6px; font-size:10.5px; }
  .toast { position:fixed; bottom:86px; left:50%; transform:translateX(-50%);
    background:var(--text); color:var(--canvas); font-size:12.5px; border-radius:8px; padding:7px 16px;
    opacity:0; pointer-events:none; transition:opacity .18s; z-index:9; box-shadow:var(--shadow-md); }
  .toast.show { opacity:.94; }
  @media (max-width: 820px) { #sidebar { display:none; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="7.5" cy="12" r="4"/><circle cx="16.5" cy="12" r="4"/><path d="M11 12h2"/></svg></span>
    <div>
      <h1>智能体协作桥</h1>
      <div class="sub">A 推理 · B 执行 · 双端可插拔</div>
    </div>
  </div>
  <div class="cluster">
    <span class="pill" id="p-sse"><span class="led"></span>实时 <b>连接中</b></span>
    <span class="pill" id="p-heart">心跳 <b>—</b></span>
    <span class="pill" id="p-kilo">捕获 <b>—</b></span>
    <span class="pill" id="p-inject">注回 <b>—</b></span>
    <span class="pill" id="p-stale">滞留 <b>0</b></span>
  </div>
</header>
<div id="layout">
<aside id="sidebar">
  <div class="side-head">项目
    <button id="btn-new-project" title="新建项目">＋ 新建</button>
  </div>
  <div id="proj-list"></div>
  <div class="side-foot">每个对话独立记忆<br>并绑定各自的智能体会话</div>
</aside>
<div id="main">
<div id="chat"><div class="thread" id="thread"></div></div>
<div class="composer-wrap">
  <button id="jump">↓ 回到最新<span class="badge" id="jump-badge" style="display:none">1</span></button>
  <div class="roles" id="roles">
    <label><b>A 推理</b><select id="sel-controller"></select></label>
    <label><b>B 执行</b><select id="sel-executor"></select></label>
    <span class="role-note" id="role-note">加载中…</span>
  </div>
  <div class="composer">
    <textarea id="req" rows="1" placeholder="描述你要完成的要求……（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="primary" id="send"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-8.5 18-2.3-7.2L3 11.5z"/></svg>发送</button>
  </div>
  <div class="hint"><span>你说一句 → A 整理任务书 → B 执行 → 左侧回复结果；同色气泡 = 同一轮</span><span>Ctrl+Enter 亦可发送</span></div>
  <details class="logbox"><summary>事件日志</summary><div class="log" id="events">—</div></details>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import { renderMarkdown } from "/lib.mjs";
const DEFAULT_THREAD = "thr-default";
let activeThread = localStorage.getItem("bridge-active-thread") || DEFAULT_THREAD;
let lastState = null;
const fmt = (iso) => iso ? new Date(iso).toLocaleTimeString("zh-CN", {hour12:false}) : "—";
const day = (iso) => iso ? new Date(iso).toLocaleDateString("zh-CN", {month:"long", day:"numeric"}) : "";
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const PALETTE = [0,1,2,3,4,5,6,7].map(i => ({ bg:`var(--p${i}-bg)`, bd:`var(--p${i}-bd)`, tx:`var(--p${i}-tx)` }));
function colorOf(key) { let h = 0; for (const ch of String(key)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function styleOf(c) { return `--pbg:${c.bg};--pb:${c.bd};--ptx:${c.tx}`; }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}
const ICON = {
  folder: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>',
  chat: '<svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H4l2.5-2.5A8 8 0 1 1 21 12z"/></svg>',
};

const turnNodes = new Map();
function turnHTML(x, idx) {
  const c = colorOf(x.key);
  const userText = x.task ? x.task.inputText : x.dlg.text;
  const kind = x.task ? x.task.inputKind : "控制台委派";
  const at = x.task ? x.task.created : x.dlg.startedAt;
  const userPendingChip = x.dlg ? `<span class="chip ${esc(x.dlg.phase)}">${esc(x.dlg.phase)}</span>` : "";
  const userMsg = `<div class="msg-row user">
    <div class="avatar" style="${styleOf(c)}">你</div>
    <div class="msg user" style="${styleOf(c)}">
      <div class="meta"><span>第 ${idx} 轮</span><span>${esc(kind)}</span><span>${fmt(at)}</span>${userPendingChip}</div>
      <div class="body">${esc(userText)}</div>
    </div>
  </div>`;
  let bot;
  if (x.task) {
    const t = x.task;
    const done = t.phase === "已完成";
    const chip = done ? (t.resultStatus || "无结果") : t.phase;
    let bodyHtml;
    if (!done) {
      if (t.phase === "执行中") {
        bodyHtml = (t.progress && t.progress.length)
          ? `<div class="progress">${t.progress.map(p => `<div>${esc(p)}</div>`).join("")}</div>`
          : '<span class="waiting">执行器正在执行</span><span class="dots"></span>';
      } else {
        bodyHtml = '<span class="waiting">排队中，等待执行</span><span class="dots"></span>';
      }
    } else {
      bodyHtml = t.resultSummary ? renderMarkdown(t.resultSummary) : '<span class="waiting">（结果文件无摘要）</span>';
    }
    bot = `<div class="msg-row bot">
    <div class="avatar" style="${styleOf(c)}">B</div>
    <div class="msg bot" style="${styleOf(c)}">
      <div class="meta"><span class="chip ${esc(chip)}">${esc(chip)}</span>${
        t.stale ? `<span class="chip stale">⚠ ${esc(t.stale)}</span>` : ""}${
        done ? `<span>完成 ${fmt(t.completed)}</span>` : `<span>入队 ${fmt(t.created)}</span>`}</div>
      <div class="body">${bodyHtml}</div>
      ${t.injected && t.injectNote ? `<div class="inject">Kilo 已注回汇报：${esc(t.injectNote)}</div>` : ""}
      ${t.injected && !t.injectNote ? `<div class="inject">✓ 已注回 Kilo 会话</div>` : ""}
      <div class="actions">${done && t.resultStatus === "done" ? `<button class="rework" data-file="${esc(t.file)}">↻ 返修</button>` : ""}<button class="copy" data-file="${esc(t.file)}" data-sum="${esc(t.resultSummary || "")}">⧉ 复制</button></div>
      <div class="meta" style="margin-top:5px"><span class="file">${esc(t.file)}</span></div>
    </div>
  </div>`;
  } else {
    bot = `<div class="msg-row bot">
    <div class="avatar" style="${styleOf(c)}">A</div>
    <div class="msg bot" style="${styleOf(c)}">
      <div class="meta"><span class="chip ${esc(x.dlg.phase)}">${esc(x.dlg.phase)}</span><span>${fmt(x.dlg.startedAt)}</span></div>
      <div class="body waiting">${x.dlg.error ? esc(x.dlg.error) : "A 端正在推理整理任务书"}${x.dlg.phase === "推理中" ? '<span class="dots"></span>' : ""}</div>
    </div>
  </div>`;
  }
  return userMsg + bot;
}
const EMPTY_HTML = `<div class="empty-hero">
  <svg width="46" height="46" viewBox="0 0 48 48" fill="none"><rect x="4" y="16" width="15" height="15" rx="4" stroke="var(--accent)" stroke-width="2.2"/><rect x="29" y="17" width="15" height="15" rx="4" stroke="var(--muted)" stroke-width="2.2"/><path d="M19 23.5h10M24 20.5v6" stroke="var(--faint)" stroke-width="2"/><circle cx="39" cy="14.5" r="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="2"/><path d="M36.5 14.5l1.8 1.8 3-3.4" stroke="var(--success)" stroke-width="1.8" fill="none"/></svg>
  <h2>让一个 AI 给另一个 AI 派活</h2>
  <p>说一句需求，A 端整理成任务书，B 端执行并直播汇报。</p>
  <div class="empty-steps">
    <div class="step"><b>① 输入需求</b>下方输入框，Enter 发送</div>
    <div class="step"><b>② A 自动整理</b>生成带验收标准的任务书</div>
    <div class="step"><b>③ B 执行直播</b>结果自动回到对话</div>
  </div>
</div>`;
function renderThread(s) {
  const chat = document.getElementById("chat");
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 90;
  const th = document.getElementById("thread");
  const inThread = (t) => (t.thread || DEFAULT_THREAD) === activeThread;
  const turns = [];
  for (const t of [...s.tasks].reverse().filter(inThread)) turns.push({ key: t.file, task: t });
  for (const d of s.delegations.filter(d => !d.taskFile && (d.thread || DEFAULT_THREAD) === activeThread).slice().reverse()) turns.push({ key: d.id, dlg: d });

  if (!turns.length) {
    th.innerHTML = EMPTY_HTML; turnNodes.clear(); return;
  }
  let idx = 0, sawDay = null;
  for (const x of turns) {
    const at = x.task ? x.task.created : x.dlg.startedAt;
    const d = day(at);
    if (d && d !== sawDay) {
      sawDay = d;
      let sep = th.querySelector(`.daysep[data-day="${d}"]`);
      if (!sep) { sep = document.createElement("div"); sep.className = "daysep"; sep.dataset.day = d; sep.innerHTML = `<span>${d}</span>`; }
      th.appendChild(sep);
    }
    idx += 1;
    const sig = JSON.stringify([idx, x.task ?? x.dlg]);
    let entry = turnNodes.get(x.key);
    if (!entry) {
      entry = { el: document.createElement("div"), sig: "" };
      entry.el.className = "turn"; entry.el.dataset.key = x.key;
      turnNodes.set(x.key, entry);
    }
    if (entry.sig !== sig) { entry.el.innerHTML = turnHTML(x, idx); entry.sig = sig; }
    th.appendChild(entry.el);
  }
  for (const [k, e] of [...turnNodes]) if (!turns.some(t => t.key === k)) { e.el.remove(); turnNodes.delete(k); }
  const emptyEl = th.querySelector(".empty-hero"); if (emptyEl) emptyEl.remove();
  const unread = document.getElementById("jump-badge");
  if (!nearBottom) {
    document.getElementById("jump").classList.add("show");
    const doneCount = s.tasks.filter(t => t.phase === "已完成").length;
    unread.style.display = doneCount > 0 ? "" : "none";
    unread.textContent = doneCount;
  } else {
    document.getElementById("jump").classList.remove("show");
    chat.scrollTop = chat.scrollHeight;
  }
}
let lastEventsSig = "";
function renderEvents(s) {
  const sig = JSON.stringify(s.events.slice(0, 60));
  if (sig === lastEventsSig) return;
  lastEventsSig = sig;
  document.getElementById("events").innerHTML = s.events.slice(0, 60).map(e =>
    `<div><time>${fmt(e.at)}</time>${esc(e.text)}</div>`).join("") || "—";
}
function renderSidebar(s) {
  const list = document.getElementById("proj-list");
  const projects = s.threads && s.threads.length ? s.threads : [{ id:"prj-default", name:"默认项目", threads:[{ id: DEFAULT_THREAD, name:"默认对话" }] }];
  if (!projects.some(p => p.threads.some(t => t.id === activeThread))) activeThread = DEFAULT_THREAD;
  list.innerHTML = projects.map(p => `
    <div class="proj" data-pid="${esc(p.id)}">
      <div class="proj-name"><span class="pname">${ICON.folder}<span title="${esc(p.name)}">${esc(p.name)}</span></span>
        <button class="add" data-new-thread="${esc(p.id)}" title="在此项目新建对话">＋</button></div>
      ${(p.threads || []).map(t => {
        const cnt = s.tasks.filter(x => (x.thread || DEFAULT_THREAD) === t.id).length;
        return `<div class="thread-item${t.id === activeThread ? " active" : ""}" data-thread="${esc(t.id)}">
          ${ICON.chat}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</span>
          ${cnt ? `<span class="cnt">${cnt}</span>` : ""}</div>`;
      }).join("")}
    </div>`).join("");
  document.getElementById("req").placeholder = "描述你要完成的要求……（Enter 发送，Shift+Enter 换行）";
}
document.getElementById("proj-list").addEventListener("click", async (e) => {
  const item = e.target.closest(".thread-item");
  if (item) {
    activeThread = item.dataset.thread;
    localStorage.setItem("bridge-active-thread", activeThread);
    if (lastState) render(lastState); return;
  }
  if (e.target.closest("#btn-new-project")) {
    const name = prompt("新项目名称：");
    if (!name) return;
    await fetch("/api/threads", { method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ action:"createProject", name }) });
    toast("项目已创建"); return;
  }
  const addThr = e.target.closest("[data-new-thread]");
  if (addThr) {
    const name = prompt("新对话名称：");
    if (!name) return;
    const r = await fetch("/api/threads", { method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ action:"createThread", projectId: addThr.dataset.newThread, name }) });
    const j = await r.json();
    const created = j.projects?.flatMap(p => p.threads).pop();
    if (created) { activeThread = created.id; localStorage.setItem("bridge-active-thread", activeThread); }
    toast("对话已创建并切换");
  }
});
function render(s) {
  document.querySelector("#p-heart b").textContent = fmt(s.lastPoll);
  const pk = document.querySelector("#p-kilo");
  pk.className = "pill" + (s.kiloError ? " bad" : "");
  pk.querySelector("b").textContent = s.kiloError ? "异常" : (s.kiloCapture === false ? "未装" : "正常");
  document.querySelector("#p-inject b").textContent = (s.autoInject ? "开" : "关") + ` ${s.injections}次`;
  document.querySelector("#p-stale b").textContent = s.tasks.filter(t => t.stale).length;
  lastState = s;
  renderSidebar(s);
  renderThread(s);
  renderEvents(s);
}

const btn = document.getElementById("send"), ta = document.getElementById("req");
ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(180, ta.scrollHeight) + "px"; });
async function send() {
  const text = ta.value.trim();
  if (!text) return;
  btn.disabled = true;
  try {
    const r = await fetch("/api/delegate", { method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ text, threadId: activeThread }) });
    const j = await r.json();
    if (!j.ok) toast(j.error || "委派失败");
    else { ta.value = ""; ta.style.height = "auto"; document.getElementById("chat").scrollTop = 1e9; }
  } catch (e) { toast("网络错误：" + e.message); }
  btn.disabled = false;
}
btn.onclick = send;
ta.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) { e.preventDefault(); send(); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
document.getElementById("thread").addEventListener("click", (e) => {
  const rework = e.target.closest(".rework");
  if (rework) {
    ta.value = `返修「${rework.dataset.file}」这一轮：`;
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    toast("已填入返修目标，补充说明后 Enter 发送");
    return;
  }
  const copy = e.target.closest(".copy");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.sum || "").then(() => toast("结果已复制"), () => toast("复制失败"));
  }
});
document.getElementById("jump").addEventListener("click", () => {
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
});

const ROLE_LABEL = { "kilo": "Kilo", "claude": "Claude Code", "codex": "Codex", "none": "无（直投）", "zcode-session": "ZCode 会话（取件）" };
async function loadAgents() {
  try {
    const a = await (await fetch("/api/agents")).json();
    const sc = document.getElementById("sel-controller"), se = document.getElementById("sel-executor");
    sc.innerHTML = a.controllers.map(id => {
      const info = a.adapters[id];
      const mark = info && !info.available ? "（不可用）" : "";
      return `<option value="${id}" ${a.current.controller === id ? "selected" : ""}>${ROLE_LABEL[id] || id}${mark}</option>`;
    }).join("");
    se.innerHTML = a.executors.map(id => {
      const info = a.adapters[id];
      const mark = info && !info.available ? "（不可用）" : "";
      return `<option value="${id}" ${a.current.executor === id ? "selected" : ""}>${ROLE_LABEL[id] || id}${mark}</option>`;
    }).join("");
    const cc = a.adapters[a.current.controller], ce = a.adapters[a.current.executor];
    const bits = [];
    if (cc) bits.push(`A·${cc.label}：${cc.note}`);
    if (a.current.controller === "none") bits.push("A·无推理：需求直接入队");
    if (a.current.executor === "zcode-session") bits.push("B·ZCode 会话：队列取件");
    else if (ce) bits.push(`B·${ce.label}：无头直执，即时`);
    document.getElementById("role-note").textContent = bits.join("｜");
  } catch (e) { document.getElementById("role-note").textContent = "智能体信息加载失败"; }
}
async function switchAgent(kind, value) {
  try {
    await fetch("/api/agents", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ [kind]: value }) });
    await loadAgents();
    toast(`已切换（${kind === "controller" ? "A 推理" : "B 执行"}），新任务生效`);
  } catch (e) { toast("切换失败：" + e.message); }
}
document.getElementById("sel-controller").addEventListener("change", (e) => switchAgent("controller", e.target.value));
document.getElementById("sel-executor").addEventListener("change", (e) => switchAgent("executor", e.target.value));
loadAgents();

const pSse = document.getElementById("p-sse");
let sseOpen = false;
function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { sseOpen = true; pSse.className = "pill on"; pSse.querySelector("b").textContent = "已连接"; };
  es.onmessage = (ev) => { try { render(JSON.parse(ev.data)); } catch {} };
  es.onerror = () => {
    pSse.className = "pill"; pSse.querySelector("b").textContent = "重连中";
    es.close(); setTimeout(connect, 3000);
  };
}
connect();
// 降级通道：SSE 被代理缓冲或未就开时，用普通轮询保证界面持续更新
setInterval(async () => {
  if (sseOpen) return;
  try {
    const r = await fetch("/api/state");
    render(await r.json());
    pSse.className = "pill on"; pSse.querySelector("b").textContent = "轮询";
  } catch {}
}, 3000);
</script>
