name: Windows candidate checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-checks:
    # Provisioned interactive Windows 11 x64 with licensed Word-compatible COM
    # and SimSun CJK fonts. An ordinary hosted runner cannot claim these tools.
    runs-on: [self-hosted, Windows, X64, ai-workbench-format-tools]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.0
      - name: Locked dependencies
        shell: pwsh
        run: |
          npm install --global npm@11.17.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install uv==0.13.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --all-extras --project services/orchestrator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Static and local system regression
        shell: pwsh
        run: |
          services/orchestrator/.venv/Scripts/python.exe release/check-prerequisites.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          services/orchestrator/.venv/Scripts/python.exe scripts/check_contracts.py --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          services/orchestrator/.venv/Scripts/python.exe -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/vitest/vitest.mjs run tests/desktop tests/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Desktop E2E against local product
        shell: pwsh
        run: |
          npm run build:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:desktop:test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage and build internal unsigned candidate
        shell: pwsh
        run: |
          services/orchestrator/.venv/Scripts/python.exe release/stage-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./release/build-windows.ps1 -InternalUnsigned
      - name: Release evidence gate (missing external evidence fails)
        shell: pwsh
        run: |
          services/orchestrator/.venv/Scripts/python.exe release/create-manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain candidate and no-go evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-windows-candidate-and-evidence
          path: |
            dist/windows
            artifacts/qa
          if-no-files-found: error
          retention-days: 14

# No publishing/signing job is configured. PRs receive no signing credentials.
# A future protected production-signing environment must re-observe final bytes
# and require independently reviewed install/update/model/manual/24h evidence.
